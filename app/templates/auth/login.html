{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><h1 class="h3 mb-4">เข้าสู่ระบบ QMS-LIS</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card card-body"><label class="form-label" for="username">ชื่อผู้ใช้</label><input class="form-control mb-3" id="username" name="username" required autocomplete="username"><label class="form-label" for="password">รหัสผ่าน</label><input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password"><button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button></form></div></div>
{% endblock %}
