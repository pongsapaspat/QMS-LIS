{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h3 mb-4">เปลี่ยนรหัสผ่าน</h1>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
  <form method="post" action="/change-password" class="card card-body">
    <label class="form-label" for="current_password">รหัสผ่านเดิม</label>
    <input class="form-control mb-3" id="current_password" name="current_password" type="password" required autocomplete="current-password">
    <label class="form-label" for="new_password">รหัสผ่านใหม่</label>
    <input class="form-control mb-3" id="new_password" name="new_password" type="password" minlength="8" required autocomplete="new-password">
    <label class="form-label" for="confirm_password">ยืนยันรหัสผ่านใหม่</label>
    <input class="form-control mb-3" id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
    <button class="btn btn-primary" type="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
</div></div>
{% endblock %}
