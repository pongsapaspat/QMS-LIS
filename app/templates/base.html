
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title | default("QMS-LIS") }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">QMS-LIS</a>
        <div class="navbar-nav flex-row flex-wrap column-gap-3">
          <a class="nav-link" href="/patients">Patients | ผู้ป่วย</a>
          <a class="nav-link" href="/test-catalog">Test Catalog | รายการตรวจ</a>
          <a
            class="nav-link{% if request.url.path.startswith('/worklist') %} active{% endif %}"
            href="/worklist"
            {% if request.url.path.startswith('/worklist') %}aria-current="page"{% endif %}
          >Worklist | รายการงานตรวจ</a>
          <a class="nav-link{% if request.url.path.startswith('/results/verification') %} active{% endif %}" href="/results/verification">Verification Queue</a>
          <a class="nav-link{% if request.url.path.startswith('/results/release') %} active{% endif %}" href="/results/release">Release Queue</a>
          <a class="nav-link" href="/docs">API Docs</a>
          <a class="nav-link" href="/api/v1/health">API Health</a>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <footer class="container pb-4 text-body-secondary small">
      Timezone: {{ app_timezone }}
    </footer>
  </body>
</html>
