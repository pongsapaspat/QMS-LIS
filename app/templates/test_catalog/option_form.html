{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ page_title }}</h1><a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_detail', test_id=test.id) }}">Back</a></div>{% if errors %}<div class="alert alert-danger"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" class="card card-body"><div class="row g-3"><div class="col-md-3"><label class="form-label">Code</label><input class="form-control" name="code" value="{{ values.get('code') or '' }}" {% if mode == 'edit' %}readonly{% endif %}></div><div class="col-md-4"><label class="form-label">Thai label</label><input class="form-control" name="label_th" value="{{ values.get('label_th') or '' }}"></div><div class="col-md-4"><label class="form-label">English label</label><input class="form-control" name="label_en" value="{{ values.get('label_en') or '' }}"></div><div class="col-md-2"><label class="form-label">Sort order</label><input class="form-control" name="sort_order" value="{{ values.get('sort_order') if values.get('sort_order') is not none else 0 }}"></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="is_abnormal" id="is_abnormal" {% if values.get('is_abnormal') %}checked{% endif %}><label class="form-check-label" for="is_abnormal">Abnormal result</label></div><div class="col-12"><label class="form-label">Reason | เหตุผล</label><textarea class="form-control" name="reason">{{ values.get('reason') or '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary" type="submit">Save | บันทึก</button></div></form>
{% endblock %}
