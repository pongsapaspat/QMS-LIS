{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ page_title }}</h1><a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_detail', test_id=test.id) }}">Back</a></div>{% if errors %}<div class="alert alert-danger"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" class="card card-body"><div class="row g-3"><div class="col-md-3"><label class="form-label">Sex</label><select class="form-select" name="sex">{% for value in ['ALL','MALE','FEMALE'] %}<option value="{{ value }}" {% if values.get('sex')|string == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Age unit</label><select class="form-select" name="age_unit">{% for value in ['DAYS','MONTHS','YEARS'] %}<option value="{{ value }}" {% if values.get('age_unit')|string == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Minimum age</label><input class="form-control" name="minimum_age" value="{{ values.get('minimum_age') if values.get('minimum_age') is not none else '' }}"></div><div class="col-md-3"><label class="form-label">Maximum age</label><input class="form-control" name="maximum_age" value="{{ values.get('maximum_age') if values.get('maximum_age') is not none else '' }}"></div><div class="col-md-3"><label class="form-label">Lower reference</label><input class="form-control" name="lower_value" value="{{ values.get('lower_value') if values.get('lower_value') is not none else '' }}"></div><div class="col-md-3"><label class="form-label">Upper reference</label><input class="form-control" name="upper_value" value="{{ values.get('upper_value') if values.get('upper_value') is not none else '' }}"></div><div class="col-md-3"><label class="form-label">Lower critical</label><input class="form-control" name="lower_critical" value="{{ values.get('lower_critical') if values.get('lower_critical') is not none else '' }}"></div><div class="col-md-3"><label class="form-label">Upper critical</label><input class="form-control" name="upper_critical" value="{{ values.get('upper_critical') if values.get('upper_critical') is not none else '' }}"></div><div class="col-12"><label class="form-label">Display text</label><input class="form-control" name="display_text" value="{{ values.get('display_text') or '' }}"></div><div class="col-12"><label class="form-label">Context metadata (JSON)</label><textarea class="form-control" name="context_metadata">{% if values.get('context_metadata') is mapping %}{{ values.get('context_metadata')|tojson }}{% else %}{{ values.get('context_metadata') or '' }}{% endif %}</textarea></div><div class="col-12"><label class="form-label">Reason | เหตุผล</label><textarea class="form-control" name="reason">{{ values.get('reason') or '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary" type="submit">Save | บันทึก</button></div></form>
{% endblock %}
