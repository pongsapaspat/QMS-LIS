{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ page_title }}</h1><a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_list') }}">Back | กลับ</a></div>
{% if errors %}<div class="alert alert-danger" role="alert"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" class="card card-body" novalidate><div class="row g-3">
  <div class="col-md-4"><label class="form-label" for="code">Code | รหัส</label><input class="form-control" id="code" name="code" value="{{ values.get('code') or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="name_en">English name</label><input class="form-control" id="name_en" name="name_en" value="{{ values.get('name_en') or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="name_th">Thai name | ชื่อภาษาไทย</label><input class="form-control" id="name_th" name="name_th" value="{{ values.get('name_th') or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="category_id">Category | หมวดการตรวจ</label><select class="form-select" id="category_id" name="category_id"><option value="">Select category</option>{% for item in categories %}<option value="{{ item.id }}" {% if values.get('category_id')|string == item.id|string %}selected{% endif %}>{{ item.code }} - {{ item.name_en }}{% if not item.is_active %} (inactive){% endif %}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="department_id">Department | แผนกห้องปฏิบัติการ</label><select class="form-select" id="department_id" name="department_id" required><option value="">Select department</option>{% for item in departments %}<option value="{{ item.id }}" {% if values.get('department_id')|string == item.id|string %}selected{% endif %}>{{ item.code }} - {{ item.name_en }}{% if not item.is_active %} (inactive){% endif %}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="specimen_type_id">Specimen | สิ่งส่งตรวจ</label><select class="form-select" id="specimen_type_id" name="specimen_type_id"><option value="">Select specimen</option>{% for item in specimen_types %}<option value="{{ item.id }}" {% if values.get('specimen_type_id')|string == item.id|string %}selected{% endif %}>{{ item.code }} - {{ item.name_en }}{% if not item.is_active %} (inactive){% endif %}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label" for="result_type">Result type</label><select class="form-select" id="result_type" name="result_type">{% for value, label in [('NUMERIC','NUMERIC'), ('QUALITATIVE','QUALITATIVE'), ('TEXT','TEXT'), ('CATEGORICAL','CATEGORICAL'), ('CBC','CBC — 5 Parameters'), ('UA','UA — 18 Parameters')] %}<option value="{{ value }}" {% if values.get('result_type')|string == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><div class="form-text">CBC/UA ใช้หน่วยและค่าอ้างอิงแยกตาม Parameter จากแบบฟอร์มที่กำหนด</div></div>
  <div class="col-md-4"><label class="form-label" for="result_unit">Result unit</label><input class="form-control" id="result_unit" name="result_unit" value="{{ values.get('result_unit') or '' }}"><div class="form-text">Required for NUMERIC tests.</div></div>
  <div class="col-md-4"><label class="form-label" for="current_price">Price</label><input class="form-control" id="current_price" name="current_price" inputmode="decimal" value="{{ values.get('current_price') if values.get('current_price') is not none else '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="tat_minutes">TAT minutes</label><input class="form-control" id="tat_minutes" name="tat_minutes" inputmode="numeric" value="{{ values.get('tat_minutes') if values.get('tat_minutes') is not none else '' }}"></div>
  <div class="col-12"><label class="form-label" for="reason">Reason | เหตุผล</label><textarea class="form-control" id="reason" name="reason" rows="2">{{ values.get('reason') or '' }}</textarea></div>
</div><div class="mt-4"><button class="btn btn-primary" type="submit">Save | บันทึก</button> <a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_list') }}">Cancel</a></div></form>
{% endblock %}
