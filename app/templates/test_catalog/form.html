{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ page_title }}</h1><a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_list') }}">Back | กลับ</a></div>
{% if errors %}<div class="alert alert-danger" role="alert"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" class="card card-body" novalidate>
  <div class="row g-3">
    {% if mode == 'edit' %}<div class="col-md-3"><label class="form-label">Code</label><input class="form-control" value="{{ test.code }}" readonly></div>{% endif %}
    <div class="col-md-{{ 9 if mode == 'edit' else 4 }}"><label class="form-label" for="name_en">English name | ชื่อภาษาอังกฤษ</label><input class="form-control" id="name_en" name="name_en" value="{{ values.get('name_en') or '' }}"></div>
    <div class="col-md-{{ 4 if mode == 'edit' else 4 }}"><label class="form-label" for="name_th">Thai name | ชื่อภาษาไทย</label><input class="form-control" id="name_th" name="name_th" value="{{ values.get('name_th') or '' }}"></div>
    {% if mode == 'create' %}<div class="col-md-4"><label class="form-label" for="code">Code | รหัส</label><input class="form-control" id="code" name="code" value="{{ values.get('code') or '' }}"></div>{% endif %}
    <div class="col-md-4"><label class="form-label" for="category_id">Category | หมวดการตรวจ</label><select class="form-select" id="category_id" name="category_id">{% for item in categories %}<option value="{{ item.id }}" {% if values.get('category_id')|string == item.id|string %}selected{% endif %}>{{ item.code }} - {{ item.name_en }}{% if not item.is_active %} (inactive){% endif %}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label" for="specimen_type_id">Specimen | สิ่งส่งตรวจ</label><select class="form-select" id="specimen_type_id" name="specimen_type_id">{% for item in specimen_types %}<option value="{{ item.id }}" {% if values.get('specimen_type_id')|string == item.id|string %}selected{% endif %}>{{ item.code }} - {{ item.name_en }}{% if not item.is_active %} (inactive){% endif %}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label" for="result_type">Result type | ชนิดผล</label><select class="form-select" id="result_type" name="result_type"><option value="NUMERIC" {% if values.get('result_type')|string == 'NUMERIC' %}selected{% endif %}>NUMERIC</option><option value="QUALITATIVE" {% if values.get('result_type')|string == 'QUALITATIVE' %}selected{% endif %}>QUALITATIVE</option></select></div>
    <div class="col-md-4"><label class="form-label" for="result_unit">Result unit | หน่วยผล</label><input class="form-control" id="result_unit" name="result_unit" value="{{ values.get('result_unit') or '' }}"><div class="form-text">Required for NUMERIC tests.</div></div>
    <div class="col-md-4"><label class="form-label" for="current_price">Price | ราคา</label><input class="form-control" id="current_price" name="current_price" inputmode="decimal" value="{{ values.get('current_price') if values.get('current_price') is not none else '' }}"></div>
    <div class="col-md-4"><label class="form-label" for="tat_minutes">TAT minutes | ระยะเวลา</label><input class="form-control" id="tat_minutes" name="tat_minutes" inputmode="numeric" value="{{ values.get('tat_minutes') if values.get('tat_minutes') is not none else '' }}"></div>
    <div class="col-12"><label class="form-label" for="reason">Reason | เหตุผล</label><textarea class="form-control" id="reason" name="reason" rows="2">{{ values.get('reason') or '' }}</textarea></div>
  </div>
  <div class="mt-4"><button class="btn btn-primary" type="submit">Save | บันทึก</button> <a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_list') }}">Cancel</a></div>
</form>
{% endblock %}
