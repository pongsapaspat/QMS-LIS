{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ page_title }}</h1><a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_departments') }}">Cancel</a></div>
{% if errors %}<div class="alert alert-danger" role="alert"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" action="{{ form_action }}" class="card card-body" novalidate><div class="row g-3">
  <div class="col-md-4"><label class="form-label" for="code">Code</label><input class="form-control" id="code" name="code" minlength="2" maxlength="30" pattern="[A-Za-z0-9_-]+" value="{{ values.get('code') or '' }}" required></div>
  <div class="col-md-4"><label class="form-label" for="name_th">Thai name</label><input class="form-control" id="name_th" name="name_th" value="{{ values.get('name_th') or '' }}" required></div>
  <div class="col-md-4"><label class="form-label" for="name_en">English name</label><input class="form-control" id="name_en" name="name_en" value="{{ values.get('name_en') or '' }}" required></div>
  {% if mode == 'create' %}<div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if values.get('is_active', true) %}checked{% endif %}><label class="form-check-label" for="is_active">Active</label></div>{% endif %}
  <div class="col-12"><label class="form-label" for="reason">Reason</label><textarea class="form-control" id="reason" name="reason" rows="2">{{ values.get('reason') or '' }}</textarea></div>
</div><div class="mt-4"><button class="btn btn-primary" type="submit">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('test_catalog_departments') }}">Cancel</a></div></form>
{% endblock %}
