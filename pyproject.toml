[project]
name = "qms-lis"
version = "0.1.0"
description = "Web-based laboratory information system for a medical technology clinic"
requires-python = ">=3.12"
dependencies = [
    "itsdangerous>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated unit tests",
    "integration: database and API integration tests",
    "e2e: end-to-end workflow tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/routes/results.py" = ["E501"]
"app/models/result.py" = ["E501"]
"app/models/test_catalog.py" = ["E501"]
"app/repositories/result.py" = ["E501"]
"app/repositories/test_catalog.py" = ["E501"]
"app/schemas/result.py" = ["E501"]
"app/services/result.py" = ["E501"]
"app/web/routes/results.py" = ["E501"]
"app/core/security.py" = ["E501"]
"app/main.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

